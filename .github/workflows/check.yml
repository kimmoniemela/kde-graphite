name: Checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  portable-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ['3.10', '3.14']
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7.0.0
        with:
          python-version: ${{ matrix.python }}
      - uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          package-manager-cache: false
      - name: Test portable installation and JavaScript behavior
        run: python -m unittest discover -s tests -v
      - name: Build standalone appearance archive
        run: python install.py build-theme
      - name: Check patch whitespace
        run: git diff --check
